controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mycobot_gripper_controller: # <--- Renamed to avoid collision
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5
      - link5_to_link6
      - link6_to_link6_flange
    command_interfaces:
      - position
    state_interfaces:
      - position

mycobot_gripper_controller: # <--- Renamed here too
  ros__parameters:
    joints:
      - gripper_controller # <--- The physical joint name stays the same
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity